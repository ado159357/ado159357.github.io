<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>如意多福喷码日期计算器</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 32px 16px 64px;
    display: flex;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #0f172a;
    background: linear-gradient(160deg, #eef2ff 0%, #f8fafc 45%, #ecfeff 100%);
    -webkit-font-smoothing: antialiased;
  }

  .app { width: 100%; max-width: 680px; }

  header h1 {
    margin: 0 0 6px;
    font-size: 20px;
    letter-spacing: .5px;
  }
  header p {
    margin: 0 0 20px;
    font-size: 13px;
    color: #64748b;
  }

  .card {
    background: #fff;
    border: 1px solid rgba(226, 232, 240, .9);
    border-radius: 16px;      /* 圆角稍微收敛一点，看起来更干练 */
    padding: 20px;            /* 卡片内边距从 22px 缩到 20px */
    margin-bottom: 16px;      /* 卡片间距稍微缩小 */
    box-shadow: 0 12px 32px -14px rgba(15, 23, 42, .2),
                0 2px 8px rgba(15, 23, 42, .04);
  }

  .field + .field { margin-top: 14px; }

  label {
    display: block;
    margin-bottom: 6px;       /* 标签下边距缩小 */
    font-size: 13px;
    font-weight: 600;
    color: #475569;
  }

  input, select {
    width: 100%;
    padding: 10px 12px;       /* 输入框内边距稍微调小，显得没那么笨重 */
    font-size: 14px;          /* 字体从 15px 缩到 14px */
    font-family: inherit;
    color: #0f172a;
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    border-radius: 8px;       /* 输入框圆角缩小，配合整体风格 */
    outline: none;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  input:focus, select:focus {
    background: #fff;
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, .15);
  }

  .row {
    display: grid;
    grid-template-columns: 1fr 110px; /* 右侧单位框稍微缩窄一点 */
    gap: 10px;
  }

  /* 快捷按钮区域 */
  .presets {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }
  .presets button {
    flex-shrink: 0;
    padding: 5px 10px;
    font-size: 12px;
    font-family: inherit;
    color: #475569;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 999px;
    cursor: pointer;
    transition: all .15s;
  }
  .presets button:hover {
    color: #4338ca;
    background: #eef2ff;
    border-color: #c7d2fe;
  }
  .presets button.active {
    color: #fff;
    background: #4f46e5;
    border-color: #4f46e5;
  }

  /* ---------- 结果区 ---------- */
  .result-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .badge {
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 600;
    color: #64748b;
    background: #eef2f7;
    border-radius: 999px;
  }
  .badge.ok      { color: #15803d; background: #dcfce7; }
  .badge.warn    { color: #b45309; background: #fef3c7; }
  .badge.expired { color: #b91c1c; background: #fee2e2; }

  .hint { font-size: 12px; color: #94a3b8; }

  .big {
    margin: 16px 0 0;
    font-size: 14px;
    color: #475569;
  }
  .big b {
    margin: 0 4px;
    font-size: 36px;          /* 大数字从 40px 缩到 36px，显得更秀气 */
    font-weight: 800;
    letter-spacing: -1px;
    color: #4f46e5;
    vertical-align: -2px;
  }
  .result.warn    .big b { color: #d97706; }
  .result.expired .big b { color: #dc2626; }

  .progress {
    height: 8px;              /* 进度条从 10px 缩到 8px */
    margin: 14px 0 0;
    background: #eef2f7;
    border-radius: 999px;
    overflow: hidden;
  }
  .progress span {
    display: block;
    width: 0;
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #6366f1, #22d3ee);
    transition: width .35s ease, background .25s ease;
  }
  .result.warn    .progress span { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
  .result.expired .progress span { background: linear-gradient(90deg, #ef4444, #f87171); }

  /* 结果明细卡片 */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); /* 稍微缩窄卡片最小宽度 */
    gap: 10px;
    margin-top: 16px;
  }
  .item {
    padding: 10px 12px;       /* 明细卡片内边距缩小 */
    background: #f8fafc;
    border: 1px solid #eef2f7;
    border-radius: 10px;
  }
  .item .k { margin-bottom: 2px; font-size: 11px; color: #94a3b8; } /* 说明文字调小 */
  .item .v { font-size: 14px; font-weight: 600; } /* 数值从 15px 缩到 14px */

  /* ---------- 独立的操作区 ---------- */
  .action-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;       /* 操作区内边距稍微缩小 */
  }

  .copy-preview {
    flex: 1;
    min-width: 0;
    padding: 8px 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 14px;          /* 预览文字从 15px 缩到 14px */
    font-weight: 600;
    color: #1e293b;
    background: #f1f5f9;
    border: 1px dashed #cbd5e1;
    border-radius: 8px;
    word-break: break-all;
    transition: all .15s;
  }
  .copy-preview:empty::before {
    content: '等待计算...';
    color: #94a3b8;
    font-weight: normal;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .action-bar button {
    flex-shrink: 0;
    padding: 9px 16px;
    font-size: 13px;          /* 按钮文字从 14px 缩到 13px */
    font-family: inherit;
    color: #fff;
    background: #4f46e5;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 6px 16px -6px rgba(79, 70, 229, .8);
    transition: background .15s, transform .1s;
  }
  .action-bar button:hover  { background: #4338ca; }
  .action-bar button:active { transform: translateY(1px); }

  .footnote {
    margin: 0;
    padding: 0 4px;
    font-size: 12px;
    line-height: 1.8;
    color: #94a3b8;
  }

  @media (max-width: 420px) {
    body { padding: 20px 12px 48px; }
    .card, .action-bar { padding: 16px; }
    .big b { font-size: 32px; }
    .action-bar { flex-direction: column; align-items: stretch; }
    .action-bar button { width: 100%; padding: 10px 16px; }
  }
</style>
</head>
<body>

<div class="app" id="app">
  <header>
    <h1>如意多福喷码日期计算器</h1>
    <p>输入生产日期与质保时长，自动计算到期日、剩余天数与质保状态。</p>
  </header>

  <!-- 输入区 -->
  <section class="card">
    <div class="field">
      <label for="startDate">生产日期</label>
      <input type="date" id="startDate" />
    </div>

    <div class="field">
      <label for="length">质保时长</label>
      <div class="row">
        <input type="number" id="length" value="3" min="0" step="1" inputmode="numeric" />
        <select id="unit">
          <option value="month">月</option>
          <option value="day">天</option>
        </select>
      </div>
      <div class="presets">
        <button type="button" class="preset active" data-len="3"  data-unit="month">3个月</button>
        <button type="button" class="preset" data-len="6"  data-unit="month">6个月</button>
        <button type="button" class="preset" data-len="45" data-unit="day">45 天</button>
        <button type="button" class="preset" data-len="60" data-unit="day">60 天</button>
        <button type="button" class="preset" data-len="90" data-unit="day">90 天</button>
        <button type="button" class="preset" data-len="100" data-unit="day">100 天</button>
      </div>
    </div>
  </section>

  <!-- 操作区 -->
  <section class="card action-bar">
    <div class="copy-preview" id="copyPreview"></div>
    <button type="button" id="copyBtn">复制结果</button>
  </section>

  <!-- 结果区 -->
  <section class="card result" id="result">
    <div class="result-top">
      <span class="badge" id="badge">等待输入</span>
      <span class="hint" id="note"></span>
    </div>
    <div class="big" id="big">—</div>
    <div class="progress"><span id="bar"></span></div>
    <div class="grid" id="grid"></div>
  </section>

  <p class="footnote">
    计算规则：到期日 = 生产日期 + 质保时长。<br />
    按月：先按自然月顺延并做月末对齐，若结果<strong>不是</strong>当月最后一天则提前 1 天，若<strong>是</strong>当月最后一天则保持不变。<br />
    按天：一律在原结果基础上提前 1 天。到期日当天仍计入质保期内。<br />
    时长为 0 时，到期日即生产日期当天。
  </p>
</div>

<script>
(function () {
  'use strict';

  var startEl  = document.getElementById('startDate');
  var lenEl    = document.getElementById('length');
  var unitEl   = document.getElementById('unit');
  var resultEl = document.getElementById('result');
  var badgeEl  = document.getElementById('badge');
  var noteEl   = document.getElementById('note');
  var bigEl    = document.getElementById('big');
  var barEl    = document.getElementById('bar');
  var gridEl   = document.getElementById('grid');
  var copyBtn  = document.getElementById('copyBtn');
  var copyPreviewEl = document.getElementById('copyPreview');

  var WEEK = ['日', '一', '二', '三', '四', '五', '六'];
  var UNIT_NAME = { month: '个月', day: '天' };
  var lastText = '';

  /* ---------- 日期工具 ---------- */
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function toISO(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function parseISO(s) {
    var p = s.split('-');
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }

  function startOfDay(d) {
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }

  function addDays(d, n) {
    return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  }

  function addMonths(d, n) {
    var day = d.getDate();
    var t = new Date(d.getFullYear(), d.getMonth(), 1);
    t.setMonth(t.getMonth() + n);
    var daysInMonth = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
    t.setDate(Math.min(day, daysInMonth));
    return t;
  }

  function isMonthEnd(d) {
    return d.getDate() === new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  }

  /* ---------- 到期日计算 ---------- */
  function addDuration(d, n, unit) {
    if (n === 0) return d;
    if (unit === 'day') {
      return addDays(d, n - 1);
    }
    var t = addMonths(d, n);
    if (!isMonthEnd(t)) t = addDays(t, -1);
    return t;
  }

  function diffDays(a, b) {
    return Math.round((b - a) / 86400000);
  }

  function fmt(d) {
    return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() +
           '日 星期' + WEEK[d.getDay()];
  }

  function fmtCompact(d) {
    return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
  }

  /* ---------- 核心计算 ---------- */
  function calc() {
    var today = startOfDay(new Date());
    var raw   = startEl.value;
    var n     = Math.floor(Number(lenEl.value));
    var unit  = unitEl.value;

    if (!raw || !isFinite(n) || n < 0) {
      resultEl.className = 'card result';
      badgeEl.className = 'badge';
      badgeEl.textContent = '等待输入';
      noteEl.textContent = '';
      bigEl.textContent = '请输入生产日期与质保时长';
      barEl.style.width = '0%';
      gridEl.innerHTML = '';
      lastText = '';
      copyPreviewEl.textContent = '';
      return;
    }

    var start  = parseISO(raw);
    var expiry = addDuration(start, n, unit);

    var total  = diffDays(start, expiry);
    var remain = diffDays(today, expiry);
    var used   = diffDays(start, today);

    var cls, label;
    if (remain < 0)        { cls = 'expired'; label = '已过保'; }
    else if (remain === 0) { cls = 'warn';    label = '今天到期'; }
    else if (remain <= 30) { cls = 'warn';    label = '即将到期'; }
    else                   { cls = 'ok';      label = '质保有效'; }

    resultEl.className = 'card result ' + cls;
    badgeEl.className  = 'badge ' + cls;
    badgeEl.textContent = label;

    noteEl.textContent = (start > today) ? '生产日期在未来' : '';

    if (remain >= 0) {
      bigEl.innerHTML = '剩余 <b>' + remain + '</b> 天';
    } else {
      bigEl.innerHTML = '已过保 <b>' + (-remain) + '</b> 天';
    }

    var pct = total <= 0 ? 100 : Math.min(100, Math.max(0, used / total * 100));
    barEl.style.width = pct.toFixed(2) + '%';

    var rows = [
      ['生产日期',   fmt(start)],
      ['质保到期日', fmt(expiry)],
      ['质保时长',   n + ' ' + UNIT_NAME[unit]],
      ['质保总天数', Math.max(0, total) + ' 天'],
      ['已使用',     Math.max(0, used) + ' 天'],
      ['剩余天数',   remain >= 0 ? remain + ' 天' : '已超 ' + (-remain) + ' 天']
    ];

    gridEl.innerHTML = rows.map(function (r) {
      return '<div class="item"><div class="k">' + r[0] +
             '</div><div class="v">' + r[1] + '</div></div>';
    }).join('');

    lastText = '喷码日期：' + fmtCompact(start) + ' / ' + fmtCompact(expiry);
    copyPreviewEl.textContent = lastText;
  }

  /* ---------- 复制与事件绑定 ---------- */
  function resetBtnText() {
    setTimeout(function () { copyBtn.textContent = '复制结果'; }, 1500);
  }

  function fallbackCopy() {
    var ta = document.createElement('textarea');
    ta.value = lastText;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      copyBtn.textContent = '已复制 ✓';
      resetBtnText();
    } catch (e) {
      copyBtn.textContent = '复制失败';
      resetBtnText();
    }
    document.body.removeChild(ta);
  }

  copyBtn.addEventListener('click', function () {
    if (!lastText) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(lastText).then(function () {
        copyBtn.textContent = '已复制 ✓';
        resetBtnText();
      }, fallbackCopy);
    } else {
      fallbackCopy();
    }
  });

  var presetBtns = Array.prototype.slice.call(document.querySelectorAll('.preset'));
  presetBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      lenEl.value  = btn.dataset.len;
      unitEl.value = btn.dataset.unit;
      presetBtns.forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      calc();
    });
  });

  function clearPresetActive() {
    presetBtns.forEach(function (b) { b.classList.remove('active'); });
  }
  lenEl.addEventListener('input', clearPresetActive);
  unitEl.addEventListener('change', clearPresetActive);

  [startEl, lenEl, unitEl].forEach(function (el) {
    el.addEventListener('input', calc);
    el.addEventListener('change', calc);
  });

  startEl.value = toISO(startOfDay(new Date()));
  calc();
})();
</script>
</body>
</html>
